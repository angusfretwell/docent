[tools]
node = "24.18.0"
bun = "1.3.14"

[tasks]
install = "bun install"
ci = "bun ci"
build = "bun run build"
compile = "bun run compile"
serve = "bun run serve"
dev = "bun run dev"
typecheck = "bun run typecheck"
test = "bun test"
check = "bun run check"
fix = "bun run fix"

[tasks.preflight]
depends = ["check", "typecheck", "test", "compile"]
