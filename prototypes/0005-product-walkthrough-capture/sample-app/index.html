<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sample app under review — signup flow</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #0f1117; color: #e6e6e6; }
    .app { max-width: 480px; margin: 40px auto; padding: 24px; background: #171a21; border-radius: 12px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    label { display: block; font-size: 13px; margin: 14px 0 4px; color: #9aa4b2; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2b303b; background: #0f1117; color: #e6e6e6; font-size: 14px; }
    button { margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #4f7cff; color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .toast { margin-top: 16px; padding: 12px; border-radius: 8px; background: #12351f; color: #57d98a; font-size: 14px; display: none; }
    .toast.show { display: block; }
    .err { color: #ff6b6b; font-size: 12px; margin-top: 4px; min-height: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Create your account</h1>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />
    <div class="err" id="email-err"></div>
    <label for="pw">Password</label>
    <input id="pw" type="password" placeholder="at least 8 characters" />
    <div class="err" id="pw-err"></div>
    <button id="submit" disabled>Create account</button>
    <div class="toast" id="toast">Account created — welcome aboard! 🎉</div>
  </div>
  <script>
    const email = document.getElementById('email');
    const pw = document.getElementById('pw');
    const btn = document.getElementById('submit');
    const toast = document.getElementById('toast');
    function validate() {
      const okEmail = /.+@.+\..+/.test(email.value);
      const okPw = pw.value.length >= 8;
      document.getElementById('email-err').textContent = email.value && !okEmail ? 'Enter a valid email' : '';
      document.getElementById('pw-err').textContent = pw.value && !okPw ? 'Too short' : '';
      btn.disabled = !(okEmail && okPw);
    }
    email.addEventListener('input', validate);
    pw.addEventListener('input', validate);
    btn.addEventListener('click', () => {
      toast.classList.add('show');
      btn.textContent = 'Account created';
      btn.disabled = true;
    });
  </script>
</body>
</html>
