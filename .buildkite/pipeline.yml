cache: "/tmp/.bun-cache"

env:
  BUN_INSTALL_CACHE_DIR: "/tmp/.bun-cache"

x-vercel-deploy: &vercel_deploy
  depends_on: build-website
  secrets:
    - VERCEL_TOKEN
    - VERCEL_ORG_ID
    - VERCEL_PROJECT_ID
  plugins:
    - mise#v1.1.3: ~
    - artifacts#v1.9.4:
        download: .vercel/output
        compressed: .vercel/output.tgz

steps:
  - label: ":oxc: check"
    key: check
    command: |
      bun ci
      # `ultracite check` prints its format pass to the same stdout oxlint writes
      # the report to, so the report is its own run and `check` stays the gate.
      bunx oxlint --format=junit > junit-check.xml || true
      bun run check
    artifact_paths: junit-check.xml
    plugins:
      - mise#v1.1.3: ~

  - label: ":typescript: typecheck"
    key: typecheck
    command: |
      bun ci
      bun run typecheck
    plugins:
      - mise#v1.1.3: ~

  - label: ":bun: test"
    key: test
    command: |
      bun ci
      bun test --reporter=junit --reporter-outfile=junit-test.xml
    artifact_paths: junit-test.xml
    plugins:
      - mise#v1.1.3: ~

  - wait: ~
    continue_on_failure: true

  - label: ":junit:"
    key: test-summary
    plugins:
      - bugcrowd/test-summary#v1.11.0:
          inputs:
            - label: ":bun: test"
              artifact_path: junit-test.xml
              type: junit
            - label: ":oxc: check"
              artifact_path: junit-check.xml
              type: junit
          formatter:
            type: summary
          context: test-summary

  - label: ":vercel: build"
    key: build-website
    if: >-
      build.pull_request.repository.fork != true && (build.branch == "main" || build.pull_request.id != null)
    depends_on:
      - check
      - typecheck
      - test
    command: |
      bun ci
      bunx playwright install --with-deps chromium
      bun run --sequential build:worker build:snapshot build:website build:vercel
    plugins:
      - mise#v1.1.3: ~
      - artifacts#v1.9.4:
          upload: .vercel/output
          compressed: .vercel/output.tgz

  - label: ":vercel: preview"
    key: preview-website
    if: build.pull_request.repository.fork != true && build.pull_request.id != null
    command: |
      url=$$(bunx vercel deploy --prebuilt --archive=tgz)
      buildkite-agent annotate --style success --context preview-website \
        "Preview deployed to [$$url]($$url)"
    concurrency_group: "docent/preview-website/${BUILDKITE_BRANCH}"
    concurrency: 1
    <<: *vercel_deploy

  - label: ":vercel: deploy"
    key: deploy-website
    if: build.pull_request.id == null && build.branch == "main"
    command: |
      url=$$(bunx vercel deploy --prebuilt --archive=tgz --prod)
      buildkite-agent annotate --style success --context deploy-website \
        "Website deployed to [$$url]($$url)"
    concurrency_group: "docent/deploy-website/${BUILDKITE_BRANCH}"
    concurrency: 1
    <<: *vercel_deploy
