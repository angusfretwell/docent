<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>docent</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        font:
          14px ui-sans-serif,
          system-ui,
          sans-serif;
        color-scheme: light dark;
      }
      .tree-file-row,
      .tree-dir-row {
        border: none;
        color: inherit;
        cursor: pointer;
        font: inherit;
        padding: 0.15rem 0.5rem;
        text-align: left;
        width: 100%;
      }
      .tree-file-row {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
        background: transparent;
      }
      .tree-file-row-wrap {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .tree-viewed-check {
        flex: none;
        cursor: pointer;
        margin: 0;
      }
      .viewed-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        cursor: pointer;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      .viewed-toggle input {
        cursor: pointer;
        margin: 0;
      }
      .viewed-changed {
        color: #d29922;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .viewed-progress {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        font-size: 0.75rem;
        opacity: 0.85;
      }
      .viewed-bar {
        height: 0.3rem;
        border-radius: 0.3rem;
        background: rgba(128, 128, 128, 0.25);
        overflow: hidden;
      }
      .viewed-bar-fill {
        height: 100%;
        background: #3fb950;
        transition: width 0.15s ease;
      }
      .quick-filter {
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 0.35rem;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
        padding: 0.1rem 0.5rem;
      }
      .quick-filter.is-active {
        background: rgba(56, 139, 253, 0.2);
        border-color: rgba(56, 139, 253, 0.6);
      }
      .tree-dir-row {
        display: block;
        background: transparent;
        opacity: 0.75;
      }
      .expand-context {
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 0.35rem;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-size: 0.75rem;
        opacity: 0.8;
        padding: 0.1rem 0.5rem;
      }
      .expand-context:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .edge-row {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.75rem;
        opacity: 0.85;
        white-space: nowrap;
      }
      .edge-chip {
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 0.35rem;
        padding: 0 0.35rem;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        opacity: 0.9;
      }
      .edge-mono {
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
      }
      .edge-image-compare {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        padding: 0.5rem 0;
      }
      .edge-image-cell {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.7rem;
        opacity: 0.85;
      }
      .edge-image {
        max-width: 240px;
        max-height: 200px;
        border: 1px solid rgba(128, 128, 128, 0.35);
        border-radius: 0.25rem;
        background: repeating-conic-gradient(rgba(128, 128, 128, 0.15) 0% 25%, transparent 0% 50%)
          50% / 16px 16px;
        object-fit: contain;
      }
      .tree-generated {
        color: rgba(128, 128, 128, 0.9);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-left: 0.3rem;
      }
      .finding-annotation {
        border: 1px solid rgba(128, 128, 128, 0.3);
        border-radius: 0.4rem;
        background: rgba(128, 128, 128, 0.06);
        margin: 0.25rem 0.75rem;
        max-width: 40rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/main.tsx" type="module"></script>
  </body>
</html>
