<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>docent</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        font:
          14px ui-sans-serif,
          system-ui,
          sans-serif;
        color-scheme: light dark;
      }
      .tree-file-row,
      .tree-dir-row {
        border: none;
        color: inherit;
        cursor: pointer;
        font: inherit;
        padding: 0.15rem 0.5rem;
        text-align: left;
        width: 100%;
      }
      .tree-file-row {
        display: flex;
        align-items: center;
      }
      .tree-dir-row {
        display: block;
        background: transparent;
        opacity: 0.75;
      }
      .expand-context {
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 0.35rem;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-size: 0.75rem;
        opacity: 0.8;
        padding: 0.1rem 0.5rem;
      }
      .expand-context:disabled {
        cursor: default;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/main.tsx" type="module"></script>
  </body>
</html>
