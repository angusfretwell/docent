<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palette</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Palette</h1>
        <p class="tagline">A tiny color-palette toy.</p>
      </header>

      <div id="swatches"></div>

      <div class="controls">
        <button id="generate" type="button">Generate</button>
        <button id="reset" type="button">Reset</button>
        <label for="preset">Preset</label>
        <select id="preset"></select>
        <label for="count">Swatches</label>
        <input id="count" type="number" min="1" max="12" value="5" />
        <label for="format">Export as</label>
        <select id="format">
          <option value="css">CSS</option>
          <option value="json">JSON</option>
        </select>
      </div>

      <section class="panel">
        <h2>Export</h2>
        <textarea id="export" rows="8" readonly></textarea>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>History</h2>
          <button id="clear-history" type="button">Clear</button>
        </div>
        <ul id="history"></ul>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
