<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palette</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="toolbar">
        <button class="pill" id="random" type="button">
          <svg
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="m18 14 4 4-4 4" />
            <path d="m18 2 4 4-4 4" />
            <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22" />
            <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" />
            <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" />
          </svg>
          Random palette
        </button>
        <label class="pill picker">
          <select aria-label="Preset" id="preset"></select>
          <svg
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </label>
      </div>
      <ul class="columns" id="columns"></ul>
      <div class="bottombar">
        <button class="cta" id="export-open" type="button">Export palette</button>
      </div>
    </main>

    <dialog aria-labelledby="export-heading" class="modal" id="export-dialog">
      <div class="modal-head">
        <h2 id="export-heading">Export palette</h2>
        <button aria-label="Close" class="ghost" id="export-close" type="button">
          ✕
        </button>
      </div>
      <div aria-label="Export format" class="tabs" role="tablist">
        <button
          aria-controls="export-code"
          aria-selected="true"
          class="tab"
          data-format="css"
          id="tab-css"
          role="tab"
          type="button"
        >
          CSS variables
        </button>
        <button
          aria-controls="export-code"
          aria-selected="false"
          class="tab"
          data-format="tailwind"
          id="tab-tailwind"
          role="tab"
          type="button"
        >
          Tailwind
        </button>
        <button
          aria-controls="export-code"
          aria-selected="false"
          class="tab"
          data-format="figma"
          id="tab-figma"
          role="tab"
          type="button"
        >
          Figma tokens
        </button>
      </div>
      <pre
        aria-labelledby="tab-css"
        class="code"
        id="export-code"
        role="tabpanel"
        tabindex="0"
      ></pre>
      <div class="modal-foot">
        <button class="pill" id="export-copy" type="button">Copy</button>
        <button class="cta" id="export-download" type="button">
          Download .css
        </button>
      </div>
    </dialog>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
