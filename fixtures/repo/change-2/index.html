<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palette</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="toolbar">
        <button class="pill" id="random" type="button">
          <svg
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            viewBox="0 0 16 16"
          >
            <path d="M8 1.5l1.4 3.6 3.6 1.4-3.6 1.4L8 11.5 6.6 7.9 3 6.5l3.6-1.4z" />
            <path d="M13 10.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" />
          </svg>
          Random palette
        </button>
        <label class="pill picker">
          <select aria-label="Preset" id="preset"></select>
        </label>
      </div>
      <ul class="columns" id="columns"></ul>
      <div class="bottombar">
        <button class="cta" id="export-open" type="button">Export palette</button>
      </div>
    </main>

    <dialog aria-labelledby="export-heading" class="modal" id="export-dialog">
      <div class="modal-head">
        <h2 id="export-heading">Export palette</h2>
        <button aria-label="Close" class="icon" id="export-close" type="button">
          ✕
        </button>
      </div>
      <div aria-label="Export format" class="tabs" role="tablist">
        <button
          aria-controls="export-code"
          aria-selected="true"
          class="tab"
          data-format="css"
          id="tab-css"
          role="tab"
          type="button"
        >
          CSS variables
        </button>
        <button
          aria-controls="export-code"
          aria-selected="false"
          class="tab"
          data-format="tailwind"
          id="tab-tailwind"
          role="tab"
          type="button"
        >
          Tailwind
        </button>
        <button
          aria-controls="export-code"
          aria-selected="false"
          class="tab"
          data-format="figma"
          id="tab-figma"
          role="tab"
          type="button"
        >
          Figma tokens
        </button>
      </div>
      <pre
        aria-labelledby="tab-css"
        class="code"
        id="export-code"
        role="tabpanel"
        tabindex="0"
      ></pre>
      <div class="modal-foot">
        <p class="toast" hidden id="export-toast">Copied</p>
        <button class="pill" id="export-copy" type="button">Copy</button>
        <button class="cta" id="export-download" type="button">
          Download .css
        </button>
      </div>
    </dialog>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
