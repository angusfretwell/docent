name: release

# Push a `vX.Y.Z` tag to cut a release: cross-compile every platform binary,
# publish them as a GitHub Release at that tag, and publish the matching npm
# shim. The tag is the single source of truth for the version — it is written
# into the shim's package.json so the embedded version, the published npm
# version, and the Release download URL the shim fetches from all line up.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm publish provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: npm

      - run: bun run build:release

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm shim
        run: npm publish --provenance
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
