name: release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Bun cross-compiles every platform binary from one runner, publishes them as
# GitHub Release assets, then publishes the thin npm shim at the tag version.
# (docs/spec/architecture.md §5)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Build the client + embedded-asset manifest once; every target embeds it.
      - run: bun run build

      - name: Compile per-platform binaries
        run: |
          set -euo pipefail
          mkdir -p out
          compile() { # <bun-target> <asset-name>
            echo "compiling $2 ($1)"
            bun build --compile --target="$1" --outfile "out/$2" bin.ts
          }
          compile bun-linux-x64     docent-linux-x64
          compile bun-linux-arm64   docent-linux-arm64
          compile bun-darwin-x64    docent-darwin-x64
          compile bun-darwin-arm64  docent-darwin-arm64
          compile bun-windows-x64   docent-windows-x64.exe
          ls -lh out

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            out/docent-*

  npm:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Stamp the shim's version from the tag (strip the leading "v"), so the
      # download URL it builds points at this release's assets.
      - name: Set shim version
        working-directory: npm
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Publish shim to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
